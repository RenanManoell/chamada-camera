<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captura de fotografia | CEVA</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:Arial,sans-serif;padding:18px}
  main{max-width:650px;margin:auto}h1{font-size:22px;margin:8px 0}p{color:#cbd5e1;font-size:14px}
  video{width:100%;max-height:65vh;object-fit:cover;background:#000;border-radius:14px;margin-top:14px}
  canvas{display:none}.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  button{border:0;border-radius:10px;padding:14px 18px;font-weight:bold;font-size:15px;cursor:pointer;flex:1}
  #capture{background:#16a34a;color:white}#send{background:#2563eb;color:white}#retry{background:#334155;color:white}
  #preview{width:100%;max-height:65vh;object-fit:contain;border-radius:14px;display:none;margin-top:14px}
  #msg{padding:12px;background:#1e293b;border-radius:10px;line-height:1.4}
</style>
</head>
<body>
<main>
  <h1>Captura de fotografia</h1>
  <p id="typeLabel">Chamada de colaborador • CEVA / Sephora</p>
  <div id="msg">Solicitando acesso à câmera...</div>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <img id="preview" alt="Prévia da fotografia">
  <div class="actions">
    <button id="capture">Tirar foto</button>
    <button id="retry" style="display:none">Tirar novamente</button>
    <button id="send" style="display:none">Usar esta foto</button>
  </div>
</main>
<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const preview = document.getElementById('preview');
  const msg = document.getElementById('msg');
  let stream = null, dataUrl = null;

  const params = new URLSearchParams(location.search);
  const tipo = params.get('tipo') === 'SAIDA' ? 'SAÍDA' : 'ENTRADA';
  document.getElementById('typeLabel').textContent = 'Registro de ' + tipo + ' • CEVA / Sephora';

  async function startCamera() {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('Este navegador não disponibilizou a câmera. Abra a página em HTTPS usando Chrome ou Edge atualizado.');
      }
      stream = await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720}}
      });
      video.srcObject = stream;
      await video.play();
      msg.textContent = 'Câmera ativa. Posicione o rosto e tire a fotografia.';
    } catch (e) {
      msg.textContent = 'Não foi possível abrir a câmera: ' + e.message + '. Verifique a permissão do navegador e tente novamente.';
    }
  }

  document.getElementById('capture').addEventListener('click', () => {
    if (!video.videoWidth) { msg.textContent = 'A câmera ainda não está pronta.'; return; }
    const maxW = 1000;
    const scale = Math.min(1, maxW / video.videoWidth);
    canvas.width = Math.round(video.videoWidth * scale);
    canvas.height = Math.round(video.videoHeight * scale);
    canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
    dataUrl = canvas.toDataURL('image/jpeg',0.78);
    preview.src = dataUrl;
    preview.style.display = 'block';
    video.style.display = 'none';
    document.getElementById('capture').style.display = 'none';
    document.getElementById('retry').style.display = 'block';
    document.getElementById('send').style.display = 'block';
    msg.textContent = 'Confira a fotografia. Se estiver correta, toque em “Usar esta foto”.';
  });

  document.getElementById('retry').addEventListener('click', () => {
    dataUrl = null;
    preview.style.display = 'none';
    video.style.display = 'block';
    document.getElementById('capture').style.display = 'block';
    document.getElementById('retry').style.display = 'none';
    document.getElementById('send').style.display = 'none';
    msg.textContent = 'Tire uma nova fotografia.';
  });

  document.getElementById('send').addEventListener('click', () => {
    if (!dataUrl) return;
    if (!window.opener) {
      msg.textContent = 'A janela principal não foi encontrada. Feche esta janela e abra a câmera pelo sistema de chamada.';
      return;
    }
    window.opener.postMessage({type:'CHAMADA_PHOTO_CAPTURED',dataUrl:dataUrl}, '*');
    msg.textContent = 'Fotografia enviada ao sistema. Você já pode fechar esta janela.';
    stopCamera();
    setTimeout(() => window.close(), 900);
  });

  function stopCamera() {
    if (stream) stream.getTracks().forEach(track => track.stop());
  }
  window.addEventListener('beforeunload', stopCamera);
  startCamera();
</script>
</body>
</html>
