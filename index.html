<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Captura de fotografia | CEVA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:Arial,sans-serif;padding:18px}main{max-width:650px;margin:auto}h1{font-size:22px;margin:8px 0}p{color:#cbd5e1;font-size:14px}video{width:100%;max-height:65vh;object-fit:cover;background:#000;border-radius:14px;margin-top:14px}canvas{display:none}.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:14px 18px;font-weight:bold;font-size:15px;cursor:pointer;flex:1}button:disabled{opacity:.5;cursor:wait}#capture{background:#16a34a;color:white}#send{background:#2563eb;color:white}#retry{background:#334155;color:white}#preview{width:100%;max-height:65vh;object-fit:contain;border-radius:14px;display:none;margin-top:14px}#msg{padding:12px;background:#1e293b;border-radius:10px;line-height:1.4}.loader{display:inline-block;width:15px;height:15px;border:2px solid #64748b;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}.tip{font-size:12px;color:#94a3b8;margin-top:12px}
</style></head><body><main>
<h1>Captura de fotografia</h1><p id="typeLabel">Chamada de colaborador • CEVA / Sephora</p>
<div id="msg"><span class="loader"></span>Preparando a câmera. Aguarde...</div><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><img id="preview" alt="Prévia da fotografia">
<div class="actions"><button id="capture" disabled>Tirar foto</button><button id="retry" style="display:none">Tirar novamente</button><button id="send" style="display:none">Usar esta foto</button></div><p class="tip">Dica: posicione o rosto dentro da imagem e aguarde a câmera focar antes de fotografar.</p>
</main><script>
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),preview=document.getElementById('preview'),msg=document.getElementById('msg');let stream=null,dataUrl=null,sending=false;
const params=new URLSearchParams(location.search),tipo=params.get('tipo')==='SAIDA'?'SAÍDA':'ENTRADA';document.getElementById('typeLabel').textContent='Registro de '+tipo+' • CEVA / Sephora';
function status(text,loading=false){msg.innerHTML=(loading?'<span class="loader"></span>':'')+text;}
async function startCamera(){try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Este navegador não disponibilizou a câmera. Abra a página em HTTPS usando Chrome ou Edge atualizado.');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();document.getElementById('capture').disabled=false;status('Câmera pronta! Posicione o rosto e toque em “Tirar foto”.');}catch(e){status('Não foi possível abrir a câmera: '+e.message+'. Verifique a permissão do navegador e atualize a página para tentar novamente.');}}
document.getElementById('capture').addEventListener('click',()=>{if(!video.videoWidth){status('A câmera ainda está carregando. Aguarde alguns segundos.',true);return;}const maxW=1000,scale=Math.min(1,maxW/video.videoWidth);canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);dataUrl=canvas.toDataURL('image/jpeg',0.78);preview.src=dataUrl;preview.style.display='block';video.style.display='none';document.getElementById('capture').style.display='none';document.getElementById('retry').style.display='block';document.getElementById('send').style.display='block';status('Confira a fotografia. Se estiver correta, toque em “Usar esta foto”.');});
document.getElementById('retry').addEventListener('click',()=>{dataUrl=null;preview.style.display='none';video.style.display='block';document.getElementById('capture').style.display='block';document.getElementById('retry').style.display='none';document.getElementById('send').style.display='none';status('Tire uma nova fotografia.');});
document.getElementById('send').addEventListener('click',()=>{if(!dataUrl||sending)return;if(!window.opener){status('A janela principal não foi encontrada. Feche esta janela e abra a câmera pelo sistema de chamada.');return;}sending=true;const btn=document.getElementById('send');btn.disabled=true;status('Enviando a foto para a tela de chamada...',true);window.opener.postMessage({type:'CHAMADA_PHOTO_CAPTURED',dataUrl:dataUrl},'*');status('Foto enviada! Volte à tela anterior, confira a imagem e confirme o registro.');stopCamera();setTimeout(()=>window.close(),1200);});
function stopCamera(){if(stream)stream.getTracks().forEach(track=>track.stop());}window.addEventListener('beforeunload',stopCamera);startCamera();
</script></body></html>
